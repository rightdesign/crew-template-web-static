# The crew's contract for this repository — see docs/REPO_SPEC.md in the crew
# repository. Written so a first ticket can choose a framework and ship it
# without editing this file: the hooks call npm scripts, so swapping the
# build tool means changing package.json, never this.
version: 1

# This file describes the template repository itself, which is worked on a
# Mac or Linux ship and releases by merge and tag; it never deploys, because
# Pages is never enabled on a template. A repository generated from the
# template gets a different `release:` section (ci_auto plus a Pages
# `released` hook), written by the platform at generation; see the README,
# "What the platform changes when it generates your repository".
platform: unix

hooks:
  # Offline-safe once a lockfile exists; `npm install` creates it the first time.
  setup: npm install
  test: npm test
  build: npm run build

release:
  mode: integrate
  versioning: auto
  versionFiles: [package.json]
  changelog: CHANGELOG.md

# What a sandboxed run needs baked into its image: Node at the version
# .nvmrc pins. No dependencies are warmed because the template has none.
sandbox:
  setup:
    - |
      set -e
      arch="$(uname -m)"; case "$arch" in aarch64|arm64) arch=arm64;; x86_64) arch=x64;; esac
      curl -fsSL "https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-${arch}.tar.gz" | tar -xz -C /opt/crew
      mv "/opt/crew/node-v24.19.0-linux-${arch}" /opt/crew/node
      for b in node npm npx corepack; do ln -sf "/opt/crew/node/bin/$b" "/opt/crew/bin/$b"; done
    - node --version && npm --version
